<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Mobile ERP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <h1>App Mobile</h1>
</header>

<main>

    <section class="card">
        <h2>Versão Mobile</h2>
        <p>Interface adaptada para telas pequenas, estilo ERP.</p>
    </section>

    <section class="menu">
        <button class="btn">Perfil</button>
        <button class="btn">Notificações</button>
        <button class="btn">Configurações</button>
        <button class="btn">Ajuda</button>
    </section>

    <section class="card">
        <h2>Status</h2>
        <ul class="status">
            <li><strong>API:</strong> Online</li>
            <li><strong>Versão:</strong> 1.0.0</li>
            <li><strong>Atualizado em:</strong> Hoje</li>
        </ul>
    </section>

    <section class="card">
        <h2>API Conectada</h2>
        <button id="btnApi" class="btn">Chamar API</button>
        <p id="resultadoApi"></p>
    </section>

</main>

<footer class="footer">
    <p>© 2025 – App Mobile ERP</p>
</footer>

<script src="script.js"></script>

</body>
</html>
